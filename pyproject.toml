dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "greenlet>=3.5.5",
    "langchain-core>=1.5.6",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.2",
    "langgraph>=1.2.11",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.1",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "redis>=8.1.0",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.42.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
